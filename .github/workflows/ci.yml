name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python scripts/install-test-rclone.py
      - run: uv run ruff check .
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run build
        working-directory: web
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - if: runner.os == 'Linux'
        run: npm run test:e2e
        working-directory: web
      - run: uv build
