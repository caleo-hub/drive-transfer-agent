[project]
name = "drive-transfer-agent"
version = "0.1.0"
description = "A conversational Google Drive transfer assistant built with Google ADK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "google-adk[db]>=2.12",
  "httpx>=0.28", "pydantic-settings>=2.8", "aiosqlite>=0.21",
  "keyring>=25.6", "cryptography>=44", "psutil>=7", "platformdirs>=4.3", "filelock>=3.20"
]

[project.scripts]
drive-transfer-agent = "drive_transfer_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drive_transfer_agent"]

[tool.hatch.build]
artifacts = ["src/drive_transfer_agent/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires an installed rclone (no cloud credentials)"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
